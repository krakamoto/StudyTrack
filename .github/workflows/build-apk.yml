name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build StudyTrack APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.5.0
          name: "StudyTrack v1.5.0 (Daily Goal & Productivity Research)"
          body: |
            ### ⏱️ StudyTrack v1.5.0 — Daily Goal & Productivity Research

            Novità:
            - 🎯 **Obiettivo giornaliero configurabile** da 30 minuti a 4 ore.
            - 📊 **Focus Score ponderato sulle ore**: il 50% dipende dal completamento
              dell'obiettivo, con credito parziale per ogni ora studiata.
            - 🔥 **Streak obiettivo**: giorni consecutivi in cui il target viene raggiunto.
            - 📈 **Grafico 7 giorni** del completamento dell'obiettivo giornaliero.
            - 🧠 **Consigli basati sulla ricerca**: blocchi focalizzati, pause,
              pratica distribuita e goal setting specifico.
            - 🔔 Notifiche del timer con cronometro live e azione Ferma.

            Scarica `app-debug.apk` qui sotto per installarlo sul tuo smartphone Android.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
