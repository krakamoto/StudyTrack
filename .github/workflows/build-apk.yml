name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build StudyTrack APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.1.0
          name: "StudyTrack v1.1.0 (Toggl Dial Picker & Live Edit)"
          body: |
            ### ⏱️ StudyTrack v1.1.0

            Nuove funzionalità:
            - 🎯 **Modifica orario dal Timer in esecuzione**: tocca direttamente il display centrale del timer attivo per correggere l'ora di inizio in tempo reale.
            - 🔄 **Selettore a Ghiera Circolare Toggl Track**:
              - 1 giro completo a 360° = 1 ora esatta (60 minuti).
              - Ruotando in senso orario oltre le 12 l'ora avanza (+1h), in senso antiorario scala (-1h).
              - Pulsanti rapidi `[-1h]` e `[+1h]` per modifiche veloci.
            - 📊 Grafici a barre animati nativi Jetpack Compose con Material 3.

            Scarica il file `app-debug.apk` qui sotto per installarlo direttamente sul tuo smartphone Android!
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
