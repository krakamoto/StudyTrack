name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build StudyTrack APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.2.0
          name: "StudyTrack v1.2.0 (Backup, statistiche e UX)"
          body: |
            ### ⏱️ StudyTrack v1.2.0

            Novità:
            - 💾 **Backup e ripristino JSON** con validazione e conferma prima dell'import.
            - 📊 **Statistiche corrette**: grafici con giorni/settimane/mesi vuoti, streak reale e medie affidabili.
            - ✏️ **Timer modificabile mentre è attivo**: descrizione e progetto vengono salvati automaticamente.
            - ↩️ **Undo dopo l'eliminazione** di una sessione dalla cronologia.
            - ✅ **Validazione degli orari** e prevenzione dei duplicati nei progetti.
            - ⚙️ Nuova schermata **Impostazioni** per backup, ripristino ed eliminazione dei dati.

            Scarica `app-debug.apk` qui sotto per installarlo sul tuo smartphone Android.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
