name: Build & Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build StudyTrack APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StudyTrack-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.3.0
          name: "StudyTrack v1.3.0 (Productivity Analytics)"
          body: |
            ### ⏱️ StudyTrack v1.3.0 — Productivity Analytics

            Novità:
            - 🎯 **Focus Score 0–100** basato su costanza, volume di studio, durata media e streak.
            - 📈 **Trend settimanale** con confronto rispetto ai 7 giorni precedenti.
            - 📊 **Grafico 14 giorni** con tempo giornaliero e media mobile a 7 giorni.
            - 🕐 **Quando studi**: distribuzione per ora e giorno della settimana, ora e giorno più produttivi.
            - 🧠 **Insight contestuali** per migliorare costanza e concentrazione.
            - ✅ Calcolo preciso anche per sessioni a cavallo di ore e di mezzanotte.

            Scarica `app-debug.apk` qui sotto per installarlo sul tuo smartphone Android.
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
